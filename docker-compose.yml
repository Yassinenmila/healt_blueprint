
services:
  app:
    build: .
    container_name: healt-app
    ports:
      - "8000:8501"
    volumes:
      - .:/app
    working_dir: /app
    command: streamlit run app/app.py --server.address=0.0.0.0

  airflow:
    image: apache/airflow:3.1.0
    container_name: healt-airflow
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - airflow_data:/opt/airflow
    command: airflow standalone

  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    working_dir: /app
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/src/mlflow.db

volumes:
  airflow_data:
